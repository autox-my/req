# The trust anchor for Baselines (ADR 0010).
#
# This file is the statement of which keys may ratify a Baseline, and until when. It is data,
# reviewed like a corpus: a change to it is a diff someone reads. Verification consults exactly
# the key named by `req baseline --verify --key` (default below); a key absent from this file is
# UNVERIFIABLE, never a silent pass.
#
#   scheme      the verifier that must check signatures from this key ("minisign").
#   public_key  the key's text, verbatim — the two lines `minisign -G`/`-R` writes, because
#               `minisign -V -p` wants a key *file*. Public, and a pin like Cargo.lock:
#               committing it is what lets anyone verify a Baseline offline.
#   valid_from  the date this key became trusted (ISO-8601, zero-padded). **Recorded, not
#               enforced**: verification checks `valid_until` and `revoked_at` only. The lower
#               bound documents the rotation story; a Baseline claiming a time before it would
#               not be refused, so treat it as provenance rather than a pin.
#   valid_until optional. Judged at the Baseline's signing time: a v3 manifest carries
#               `signed_at`, so a key whose validity ends at or after it verifies even when today
#               is later, and one already expired then FAILS (ADR 0016). The comparison is by
#               **calendar date** (both sides reduced to YYYY-MM-DD), so a same-day expiry still
#               verifies. A v2 manifest has no trusted signing time, so its expiry stays
#               UNVERIFIABLE (ADR 0010).
#   revoked_at  optional. Revocation is **prospective** (ADR 0016): a key revoked on a *later
#               calendar date* than the Baseline's signing time still verifies for it, while one
#               revoked on or before that date FAILS (same-day counts as revoked). The v3 rule
#               needs a signing time: a **v2** Baseline has none, so it is judged at *today* and
#               a key revoked at or before today FAILS it — the older ADR 0010 answer. Record it
#               the moment a private key is lost or retired. An unreadable date is treated as
#               revoked, never as trusted.
#
# The signing time is **signer-asserted** (there is no RFC 3161 timestamp): whoever holds the
# key can mint a fresh signature declaring an earlier `signed_at`, and `--now` overrides the
# judgement time altogether. Revocation therefore bounds *newly asserted* signing times only —
# it cannot prove that a signature was made before the key was lost, and it is not a hard stop
# on a key holder who is willing to lie.
#
# Rotating a key means adding an entry beside the old one with its own validity window: old
# Baselines stay verifiable against the old key, new ones must use the new one.
keys:
  - id: "req-baseline-1"
    scheme: "minisign"
    public_key: |
      untrusted comment: minisign public key 645DD76950ED6ADF
      RWTfau1QadddZOzVi8alyp5FpDVkqDdBP0RvwmPHt5j5s+MyxyEqIkVu
    valid_from: "2026-10-08"
