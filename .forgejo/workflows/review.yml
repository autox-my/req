# The review gate: a model reads the diff and any critical or high finding blocks the merge.
#
# A second, independent check beside CI. CI proves the repository's own gate passes; this one
# asks whether the change is *good*, which no deterministic check can answer. The counting and
# the verdict live in tools/review/ocr_gate.py — and the step below takes that file from
# origin/main rather than from the pull request, so a change cannot supply the gate that judges
# it. That is why the adoption pull request fails this check by design: the gate must already
# be on main before it can judge anything, and a human merges the adoption change.
#
# Runner: host mode, so no `container:` key. No `permissions:` key either — Forgejo ignores it,
# and dead configuration that warns on every run is worse than none.
#
# Configuration (Settings, then Actions):
#   Secret   OCR_LLM_TOKEN          the provider key
#   Secret   OCR_LLM_EXTRA_HEADERS  optional, `name=value,name=value` — headers the provider
#                                   requires beyond the key (opencode asks for x-opencode-session).
#                                   A secret, not a variable: it is the channel a credential header
#                                   would travel through, and variables are readable by anyone with
#                                   read access and are not masked. Its value is never printed.
#   Variable OCR_LLM_URL            the provider base URL
#   Variable OCR_LLM_PROTOCOL       openai or anthropic
#   Variable OCR_LLM_MODEL          the model to review with — required: the model is part of the
#                                   reviewer's identity, and an unset one falls back to the CLI's
#                                   default, so the gate would change without appearing in any diff
#   Variable OCR_LLM_AUTH_HEADER    optional; empty means OCR's default, `Authorization: Bearer`
#
# OCR_LLM_AUTH_HEADER used to be hardcoded to `x-api-key` here, which ignored the repository
# variable of the same name and sent the wrong header to a Bearer provider. It is forwarded now,
# and the empty default is Bearer: a gateway that authenticates with x-api-key (the anthropic
# protocol's convention) must set the variable to `x-api-key`. The test step prints the resolved
# value, so a 401 names its own cause.
#
# Every one of these must be FORWARDED into the step that runs `ocr`, not merely set: a variable
# that exists in the repository but is not listed under a step's `env:` is invisible to the CLI,
# which then falls back to its own default. The same list appears in review-measure.yml.
#
# The protocol decides the path OCR appends — /chat/completions for openai, /v1/messages for
# anthropic — so the URL must end with or without /v1 to match. Getting the pair wrong gives
# either a doubled path (404) or "model is not supported on this endpoint" (400). Measured in
# the sibling sedia repository against opencode: .../zen/go/chat/completions is 404 and
# .../zen/go/v1/chat/completions answers, so with protocol=openai the URL ends in /v1.

name: OCR Review

on:
  pull_request:
    branches: [main]

jobs:
  ocr-review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: checkout, with the history the diff needs
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: the review CLI, installed from the committed lockfile
        run: |
          set -eu
          # The lockfile is the pin: npm ci verifies integrity against it, which a global
          # install of `latest` cannot do. This repository pins its review CLI deliberately.
          # The CLI comes from `origin/main`, never from this checkout: the review of a change must not
          # execute the tool that change supplies, in a step that holds the provider token. The pin's
          # package.json and lockfile are trusted material, exactly like the gate and the rule file.
          TOOL_DIR="$RUNNER_TEMP/ocr-tool"
          mkdir -p "$TOOL_DIR"
          for f in package.json package-lock.json; do
            if ! git cat-file -e "origin/main:tools/ocr/$f" 2>/dev/null; then
              echo "::error::origin/main has no tools/ocr/$f — fail closed, never install the tool from this checkout"
              exit 1
            fi
            git show "origin/main:tools/ocr/$f" > "$TOOL_DIR/$f"
          done
          npm --prefix "$TOOL_DIR" ci --no-fund --no-audit --cache "$GITHUB_WORKSPACE/.npm-cache"
          # The remaining steps find it through the environment; a per-step `export` would be three
          # copies of one path, free to drift.
          echo "OCR_BIN=$TOOL_DIR/node_modules/.bin" >> "$GITHUB_ENV"
          export PATH="$TOOL_DIR/node_modules/.bin:$PATH"
          if ! command -v ocr >/dev/null 2>&1; then
            echo "::error::ocr did not install, so no review can run"
            exit 1
          fi
          ocr --version
          # A stale config in a persistent $HOME overrides the environment and produces
          # "provider has no api_key configured" against a perfectly good token.
          rm -f "$HOME/.opencodereview/config.json"

      - name: the provider answers
        env:
          OCR_LLM_URL: ${{ vars.OCR_LLM_URL }}
          OCR_LLM_PROTOCOL: ${{ vars.OCR_LLM_PROTOCOL }}
          OCR_LLM_TOKEN: ${{ secrets.OCR_LLM_TOKEN }}
          OCR_LLM_MODEL: ${{ vars.OCR_LLM_MODEL }}
          OCR_LLM_AUTH_HEADER: ${{ vars.OCR_LLM_AUTH_HEADER }}
          OCR_LLM_EXTRA_HEADERS: ${{ secrets.OCR_LLM_EXTRA_HEADERS }}
        run: |
          if [ -z "${OCR_BIN:-}" ]; then
            echo "::error::OCR_BIN is not set — the runner did not carry $GITHUB_ENV to this step"
            exit 1
          fi
          export PATH="$OCR_BIN:$PATH"
          if [ -z "${OCR_LLM_TOKEN:-}" ]; then
            echo "::error::OCR_LLM_TOKEN is not set (Settings, Actions, Secrets)"
            exit 1
          fi
          # The model is part of the reviewer's identity: an unset one would fall back to the
          # CLI's default and change the gate without a diff.
          if [ -z "${OCR_LLM_MODEL:-}" ]; then
            echo "::error::OCR_LLM_MODEL is not set (Settings, Actions, Variables) — the reviewer is unnamed"
            exit 1
          fi
          # Names, lengths and states, never a value: this line is what separates "the job was
          # misconfigured" from "the provider refused a correct request". It answers "was it
          # forwarded?" for the extra headers without parsing them — any parse of the value can
          # echo a fragment of it, and a diagnostic that must not print its input should not
          # parse its input.
          if [ -n "${OCR_LLM_EXTRA_HEADERS:-}" ]; then EXTRA_STATE=set; else EXTRA_STATE=none; fi
          echo "review env: protocol=${OCR_LLM_PROTOCOL:-unset} model=${OCR_LLM_MODEL} token_len=${#OCR_LLM_TOKEN} auth_header=${OCR_LLM_AUTH_HEADER:-default} extra_headers=${EXTRA_STATE}"
          if [ -z "${OCR_LLM_AUTH_HEADER:-}" ]; then
            echo "note: OCR_LLM_AUTH_HEADER is empty, so OCR sends 'Authorization: Bearer'."
            echo "      A gateway that wants x-api-key needs the repository variable set to x-api-key."
          fi
          ocr llm test

      - name: review the diff
        env:
          OCR_LLM_URL: ${{ vars.OCR_LLM_URL }}
          OCR_LLM_PROTOCOL: ${{ vars.OCR_LLM_PROTOCOL }}
          OCR_LLM_TOKEN: ${{ secrets.OCR_LLM_TOKEN }}
          OCR_LLM_MODEL: ${{ vars.OCR_LLM_MODEL }}
          OCR_LLM_AUTH_HEADER: ${{ vars.OCR_LLM_AUTH_HEADER }}
          OCR_LLM_EXTRA_HEADERS: ${{ secrets.OCR_LLM_EXTRA_HEADERS }}
          # The head SHA, not the branch name: a pull request from a fork has no branch ref
          # in this repository, while the SHA always resolves after a full checkout.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -z "${OCR_BIN:-}" ]; then
            echo "::error::OCR_BIN is not set — the runner did not carry $GITHUB_ENV to this step"
            exit 1
          fi
          export PATH="$OCR_BIN:$PATH"
          # The rules that judge this diff come from origin/main too — the same trust
          # boundary as the gate below. A pull request runs *its own* workflow file, so a
          # rule file read from this checkout would let the change under review weaken or
          # empty the checklist that reviews it. Resolved once, before the first attempt,
          # so a missing rule file fails the job without spending a provider call.
          RULE_PATH=review/rule.json
          if git cat-file -e "origin/main:$RULE_PATH" 2>/dev/null; then
            RULE="$RUNNER_TEMP/ocr_rule_trusted.json"
            git show "origin/main:$RULE_PATH" > "$RULE"
            echo "judging with rules from $RULE_PATH at origin/main"
          else
            echo "::error::origin/main has no $RULE_PATH — fail closed, never fall back to this checkout (a pull request could then weaken or empty the checklist that reviews it)"
            exit 1
          fi
          for attempt in 1 2 3; do
            echo "== review attempt ${attempt}/3 =="
            # A congested endpoint can return transient errors for minutes; three attempts
            # with a pause ride out a bad window without failing the whole review.
            # **`--no-filter`: measured, not assumed.** After the review agent, this CLI runs a set of LLM
            # passes over the *comments* — `REVIEW_FILTER_TASK` (which candidates survive), `DEDUP_TASK`
            # (merge near-duplicates), `RE_LOCATION_TASK` (pin each comment's line range). They cost ~22% of
            # the review's work time (mean 677s -> 526s, three runs each on one 13-file diff) and they buy
            # precision: without them every comment the agent produced is kept, unverified and un-relocated.
            # The gate blocks only critical/high, so the price is reviewer attention on sharper-but-noisier
            # mediums/lows — plus the risk of a spurious blocking finding. If a clean diff ever produces a
            # critical/high, suspect this line first.
            # .forgejo diffs are reviewed in this job (the rule file's trust-material checklist applies); the bench exclusions are for generated corpora reviewed through their generator.
            if ocr review \
                 --from origin/main \
                 --to "$HEAD_SHA" \
                 --format json \
                 --output ocr-result.json \
                 --rule "$RULE" \
                 --effort low \
                 --no-filter \
                 --timeout 20 \
                 --exclude 'bench/corpus/**,bench/results/**'; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "attempt ${attempt} did not complete — retrying in 60s"
              sleep 60
            fi
          done
          echo "::error::the review did not complete after three attempts"
          exit 1

      - name: the gate, taken from main rather than from this pull request
        if: always()
        run: |
          GATE_PATH=tools/review/ocr_gate.py
          if git cat-file -e "origin/main:$GATE_PATH" 2>/dev/null; then
            GATE="$RUNNER_TEMP/ocr_gate_trusted.py"
            git show "origin/main:$GATE_PATH" > "$GATE"
            echo "judging with $GATE_PATH from origin/main"
          else
            # Fail CLOSED. Falling back to this checkout would let the very first pull
            # request supply the gate that judges it.
            echo "::error::origin/main has no $GATE_PATH — land the gate first (a human merges the adoption change), then every later change is gated by this job"
            exit 1
          fi
          python3 "$GATE" ocr-result.json --emit-json ocr-normalized.json

      - name: the findings, verbatim, in the log
        if: always()
        run: |
          # No artifact upload: this instance's artifact service is unreliable, so the job
          # log is the durable record. Printing the whole set, not a summary, is what makes
          # a finding readable after the fact.
          if [ -f ocr-result.json ]; then
            echo "--- ocr-result.json ---"
            cat ocr-result.json
            echo "--- end ---"
          else
            echo "no result file (the review did not produce one)"
          fi
