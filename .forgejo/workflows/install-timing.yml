# Install timing: how long the two ways of installing req take on this runner (ADR 0025, Consequences).
#
# The cost per job of compiling req from source was never measured (issue #65); this workflow
# measures it, next to the prebuilt install, on the machine that runs CI. It prints exactly two
# lines, each between two readings of `date +%s`:
#
#   INSTALL source: <n>s     cargo install --git ... --rev <rev> --locked, in an empty CARGO_HOME
#   INSTALL prebuilt: <n>s   examples/install-req.sh, with the pin table filled from the inputs
#
# Dispatch-only, on purpose: a measurement is taken on request, and tests/release_workflow.rs fails
# on any other trigger. **No number is ever written into a document by whoever edits this file.**
# The owner dispatches it; the orchestrator copies the two lines and the run's URL into the
# "Measured" section of docs/releasing.md. A step that fails prints no line for its install, and the
# run fails with it (no `continue-on-error`): a missing number is a finding, not a gap to fill.
#
# Inputs:
#   rev     the released rev, exactly the `REV` of the `pin:` line printed when it was released
#   sha256  the SHA-256 of that rev's x86_64-unknown-linux-gnu tarball, the `SHA256` of the same line
#
# Configuration (Settings, then Actions):
#   Secret  REQ_RELEASE_TOKEN  a token with `read:repository`: what an adopter's CI holds. Used by both
#                              installs, as a header curl reads from stdin and as a git credential
#                              header held in the environment, never on a command line, never printed.
#
# What is and is not inside each measurement, so the two numbers are comparable and honest:
#   - Both start with the toolchain already installed (the source install is not charged for
#     `rustup toolchain install`); a project with no Rust toolchain pays that on top.
#   - The source install starts from an empty CARGO_HOME, so it also pays for fetching the registry
#     index and every crate. A warm cache on a long-lived runner would make it faster; that is what
#     the cold figure is not, and the runbook says so beside the number.
#   - It fetches over https with the read token. The documented source install uses an SSH deploy
#     key (docs/adopting.md); the transport differs, the compile is the same compile.
#   - The prebuilt install runs the real script from this checkout with only its pin table filled in
#     (REV and the Linux hash); the script's test-only overrides are never set.

name: Install timing

on:
  workflow_dispatch:
    inputs:
      rev:
        description: "The released rev (REV of the release's pin line): a bare SHA"
        required: true
        type: string
      sha256:
        description: "SHA-256 of that rev's x86_64-unknown-linux-gnu tarball (SHA256 of the pin line)"
        required: true
        type: string

jobs:
  timing:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      REPO_URL: https://git.xantu-barb.ts.net/fdx/req.git
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: the inputs, validated
        env:
          REV_INPUT: ${{ github.event.inputs.rev }}
          SHA_INPUT: ${{ github.event.inputs.sha256 }}
        run: |
          set -eu
          case $REV_INPUT in
            '' | *[!0-9a-f]*)
              echo "::error::rev must be a bare lower-case hex SHA (the REV of the release's pin line)"
              exit 1
              ;;
          esac
          if [ "${#REV_INPUT}" -lt 7 ] || [ "${#REV_INPUT}" -gt 40 ]; then
            echo "::error::rev must be 7 to 40 hex digits"
            exit 1
          fi
          case $SHA_INPUT in
            '' | *[!0-9a-f]*)
              echo "::error::sha256 must be 64 lower-case hex digits (the SHA256 of the release's pin line)"
              exit 1
              ;;
          esac
          if [ "${#SHA_INPUT}" -ne 64 ]; then
            echo "::error::sha256 must be 64 lower-case hex digits"
            exit 1
          fi
          echo "REQ_REV=$REV_INPUT" >> "$GITHUB_ENV"
          echo "REQ_SHA256=$SHA_INPUT" >> "$GITHUB_ENV"

      - name: the C toolchain the source install links against
        run: |
          set -eu
          if ! command -v cc >/dev/null 2>&1; then
            echo "::error::no C linker on this runner, so every Rust build script will fail to link"
            echo "On a Debian-ish host: sudo apt-get update && sudo apt-get install -y build-essential"
            exit 1
          fi
          cc --version | head -1

      - name: rustup and the pinned toolchain, outside both measurements
        run: |
          set -eu
          export RUSTUP_HOME="$HOME/.rustup"
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain none
            . "$HOME/.cargo/env"
          fi
          rustup toolchain install 1.99.0 --profile minimal
          rustup run 1.99.0 cargo --version
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "RUSTUP_HOME=$HOME/.rustup" >> "$GITHUB_ENV"

      - name: the prebuilt install, timed
        env:
          REQ_RELEASE_TOKEN: ${{ secrets.REQ_RELEASE_TOKEN }}
        run: |
          set -eu
          if [ -z "${REQ_RELEASE_TOKEN:-}" ]; then
            echo "::error::REQ_RELEASE_TOKEN is not set (Settings, Actions, Secrets): a token with read:repository"
            exit 1
          fi
          dir="$(mktemp -d)"
          # examples/install-req.sh with its pin table (the first lines, before the header comment) taken from the inputs, and
          # nothing else changed. Both pin variables are rewritten; the macOS one stays empty here.
          awk -v rev="$REQ_REV" -v sha="$REQ_SHA256" '
            NR <= 8 && /^REV=/ { print "REV=" rev; next }
            NR <= 8 && /^SHA256_x86_64_unknown_linux_gnu=/ { print "SHA256_x86_64_unknown_linux_gnu=" sha; next }
            NR <= 8 && /^SHA256_aarch64_apple_darwin=/ { print "SHA256_aarch64_apple_darwin="; next }
            { print }
          ' examples/install-req.sh > "$dir/install-req.sh"
          for want in "REV=$REQ_REV" "SHA256_x86_64_unknown_linux_gnu=$REQ_SHA256"; do
            if ! head -n 8 "$dir/install-req.sh" | grep -Fxq -- "$want"; then
              echo "::error::the pin table of examples/install-req.sh is not where this workflow expects it (its first lines)"
              exit 1
            fi
          done
          export REQ_INSTALL_DIR="$dir/bin"
          start="$(date +%s)"
          bash "$dir/install-req.sh"
          end="$(date +%s)"
          echo "INSTALL prebuilt: $((end - start))s"

      - name: the source install, timed
        env:
          REQ_RELEASE_TOKEN: ${{ secrets.REQ_RELEASE_TOKEN }}
        run: |
          set -eu
          if [ -z "${REQ_RELEASE_TOKEN:-}" ]; then
            echo "::error::REQ_RELEASE_TOKEN is not set (Settings, Actions, Secrets): a token with read:repository"
            exit 1
          fi
          dir="$(mktemp -d)"
          # An empty CARGO_HOME: nothing cached by an earlier job helps this install. The git CLI
          # fetches (so the header below applies), with the credential held in the environment
          # rather than in an argument list.
          export CARGO_HOME="$dir/cargo-home"
          export CARGO_NET_GIT_FETCH_WITH_CLI=true
          auth="$(printf 'x-access-token:%s' "$REQ_RELEASE_TOKEN" | base64 | tr -d '\n')"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://git.xantu-barb.ts.net/.extraheader"
          export GIT_CONFIG_VALUE_0="Authorization: Basic $auth"
          start="$(date +%s)"
          rustup run 1.99.0 cargo install --git "$REPO_URL" --rev "$REQ_REV" --root "$dir/root" --locked
          end="$(date +%s)"
          echo "INSTALL source: $((end - start))s"
          "$dir/root/bin/req" --version
