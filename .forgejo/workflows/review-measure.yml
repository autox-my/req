# A **measurement** run of the review, dispatched by hand. Not a verdict and not a check:
# this workflow is `workflow_dispatch` only, its job name is distinct from review.yml's, and
# it runs no gate. A run of this file is evidence about duration and findings, never a pass.
#
# Why a second file rather than a second event on review.yml: the required check's context
# (`OCR Review / ocr-review`) must mean exactly one thing — the verdict on a pull request.
# A dispatched run that failed (a provider hiccup, a cancelled attempt) would otherwise paint
# that context red on `main` and read as a finding about the code.
#
# **Dispatch inputs are data, never script.** The runner substitutes `${{ … }}` into the script
# *before* bash parses it, so an input written inline (`--exclude "${{ inputs.exclude }}"`) would
# let a quote, `$(…)`, a backtick or `;` run commands in a step that holds the provider token.
# Every input reaches the shell through `env:` below, where it is a value and not source.
#
# Usage: POST /repos/fdx/req/actions/workflows/review-measure.yml/dispatches with
#   {"ref":"main","inputs":{"to_sha":"<sha>","label":"C1","from_ref":"origin/main"}}
name: OCR measure

on:
  workflow_dispatch:
    inputs:
      to_sha:
        description: the head to review (a full SHA that exists in the fetched history)
        required: true
        type: string
      label:
        description: a short name for this measurement ("C1", "M1", …)
        required: true
        type: string
      from_ref:
        description: the base of the diff (origin/main for a full review; a previous head for a delta)
        required: false
        default: origin/main
        type: string
      max_tools:
        description: passed to --max-tools only when it is not 0 (the CLI floor is 50)
        required: false
        default: "0"
        type: string
      no_filter:
        description: "true adds --no-filter (skip the LLM post-filter pass)"
        required: false
        default: "false"
        type: string
      exclude:
        description: gitignore-style patterns, merged with the rule file's excludes
        required: false
        default: "bench/corpus/**,bench/results/**"
        type: string

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # The inputs as DATA. Nothing below interpolates a `${{ inputs.… }}` into a script.
      MEASURE_TO: ${{ inputs.to_sha }}
      MEASURE_LABEL: ${{ inputs.label }}
      MEASURE_FROM: ${{ inputs.from_ref }}
      MEASURE_MAX_TOOLS: ${{ inputs.max_tools }}
      MEASURE_NO_FILTER: ${{ inputs.no_filter }}
      MEASURE_EXCLUDE: ${{ inputs.exclude }}
    steps:
      - name: checkout, with the history the diff needs
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.to_sha }}

      - name: the review CLI, installed from origin/main
        run: |
          set -eu
          # The tool comes from the trusted ref, never from the checked-out commit: a measurement of a
          # commit must not execute the review CLI that commit supplies, with the token in its env.
          # A bare-SHA checkout does not necessarily carry `origin/main`; the trusted ref is required
          # (the tool and the rule file both come from it), so fetch it explicitly and fail closed.
          if ! git rev-parse --verify -q origin/main >/dev/null 2>&1; then
            git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          fi
          TOOL_DIR="$RUNNER_TEMP/ocr-tool"
          mkdir -p "$TOOL_DIR"
          for f in package.json package-lock.json; do
            if ! git cat-file -e "origin/main:tools/ocr/$f" 2>/dev/null; then
              echo "::error::origin/main has no tools/ocr/$f — fail closed, never install the tool from this checkout"
              exit 1
            fi
            git show "origin/main:tools/ocr/$f" > "$TOOL_DIR/$f"
          done
          npm --prefix "$TOOL_DIR" ci --no-fund --no-audit --cache "$GITHUB_WORKSPACE/.npm-cache"
          echo "OCR_BIN=$TOOL_DIR/node_modules/.bin" >> "$GITHUB_ENV"
          export PATH="$TOOL_DIR/node_modules/.bin:$PATH"
          if ! command -v ocr >/dev/null 2>&1; then
            echo "::error::ocr did not install, so nothing can be measured"
            exit 1
          fi
          ocr --version
          # A stale config in a persistent $HOME overrides the environment and produces
          # "provider has no api_key configured" against a perfectly good token.
          rm -f "$HOME/.opencodereview/config.json"

      - name: the provider answers
        env:
          OCR_LLM_URL: ${{ vars.OCR_LLM_URL }}
          OCR_LLM_PROTOCOL: ${{ vars.OCR_LLM_PROTOCOL }}
          OCR_LLM_TOKEN: ${{ secrets.OCR_LLM_TOKEN }}
          OCR_LLM_MODEL: ${{ vars.OCR_LLM_MODEL }}
          OCR_LLM_AUTH_HEADER: x-api-key
        run: |
          set -eu
          if [ -z "${OCR_BIN:-}" ]; then
            echo "::error::OCR_BIN is not set — the runner did not carry $GITHUB_ENV to this step"
            exit 1
          fi
          export PATH="$OCR_BIN:$PATH"
          if [ -z "${OCR_LLM_TOKEN:-}" ]; then
            echo "::error::OCR_LLM_TOKEN is not set (Settings, Actions, Secrets)"
            exit 1
          fi
          echo "measure env: protocol=${OCR_LLM_PROTOCOL:-unset} model=${OCR_LLM_MODEL:-unset} token_len=${#OCR_LLM_TOKEN}"
          ocr llm test

      - name: one review attempt, measured
        env:
          OCR_LLM_URL: ${{ vars.OCR_LLM_URL }}
          OCR_LLM_PROTOCOL: ${{ vars.OCR_LLM_PROTOCOL }}
          OCR_LLM_TOKEN: ${{ secrets.OCR_LLM_TOKEN }}
          OCR_LLM_MODEL: ${{ vars.OCR_LLM_MODEL }}
          OCR_LLM_AUTH_HEADER: x-api-key
        run: |
          set -eu
          if [ -z "${OCR_BIN:-}" ]; then
            echo "::error::OCR_BIN is not set — the runner did not carry $GITHUB_ENV to this step"
            exit 1
          fi
          export PATH="$OCR_BIN:$PATH"
          RULE_PATH=review/rule.json
          if ! git cat-file -e "origin/main:$RULE_PATH" 2>/dev/null; then
            echo "::error::origin/main has no $RULE_PATH — fail closed, never fall back to this checkout"
            exit 1
          fi
          RULE="$RUNNER_TEMP/ocr_rule_trusted.json"
          git show "origin/main:$RULE_PATH" > "$RULE"
          echo "measuring with rules from $RULE_PATH at origin/main"

          # A measurement is a single attempt: riding out a bad window would average two different
          # things together and call it a number.
          extra=""
          if [ "$MEASURE_MAX_TOOLS" != "0" ]; then extra="$extra --max-tools $MEASURE_MAX_TOOLS"; fi
          if [ "$MEASURE_NO_FILTER" = "true" ]; then extra="$extra --no-filter"; fi

          set +e
          started=$(date +%s)
          # shellcheck disable=SC2086
          ocr review \
            --from "$MEASURE_FROM" \
            --to "$MEASURE_TO" \
            --format json \
            --output ocr-result.json \
            --rule "$RULE" \
            --effort low \
            --timeout 20 \
            --exclude "$MEASURE_EXCLUDE" \
            $extra > /tmp/measure.log 2>&1
          rc=$?
          elapsed=$(( $(date +%s) - started ))
          set -e
          printf '%s\n' "$rc" > /tmp/measure.rc
          printf '%s\n' "$elapsed" > /tmp/measure.elapsed
          echo "review finished rc=${rc} elapsed=${elapsed}s"
          cat /tmp/measure.log
          exit "$rc"

      - name: MEASURE
        if: always()
        run: |
          set -eu
          # Every parser here is best-effort: the step must print its record even when the review
          # failed and `ocr-result.json` is absent or truncated — that is exactly when a measurement
          # is worth having. A shape the schema does not guarantee yields "none"/"unavailable", never
          # an abort under `set -e`.
          cat > /tmp/summarize.py <<'PY'
          import collections, json, sys
          def out(tokens="none", findings="none", rounds=-1):
              print(tokens); print(findings); print(rounds)
          try:
              with open("ocr-result.json", encoding="utf-8") as handle:
                  document = json.load(handle)
          except Exception:
              out(); sys.exit(0)
          if not isinstance(document, dict):
              out(); sys.exit(0)
          tokens = document.get("total_tokens", "none")
          comments = document.get("comments")
          comments = comments if isinstance(comments, list) else []
          hist = collections.Counter(
              str(c.get("severity", "")).strip().lower()
              for c in comments if isinstance(c, dict)
          )
          findings = "/".join(str(hist.get(s, 0)) for s in ("critical", "high", "medium", "low"))
          rounds = -1
          calls = document.get("tool_calls")
          if isinstance(calls, dict):
              numbers = [v for v in calls.values() if isinstance(v, int)]
              rounds = sum(numbers) if numbers else -1
          elif isinstance(calls, list):
              rounds = len(calls)
          out(tokens, findings, rounds)
          PY
          python3 /tmp/summarize.py > /tmp/summary.txt 2>/dev/null || printf 'none\nnone\n-1\n' > /tmp/summary.txt
          tokens=$(sed -n 1p /tmp/summary.txt)
          findings=$(sed -n 2p /tmp/summary.txt)
          rounds_json=$(sed -n 3p /tmp/summary.txt)
          if [ "$rounds_json" -ge 0 ] 2>/dev/null; then
            rounds="$rounds_json"; rounds_src=json
          else
            # Fallback: the CLI's progress glyph. Labelled, because a formatting change must not
            # silently read as "no rounds".
            glyph=$(grep -c '▶' /tmp/measure.log 2>/dev/null || true)
            if [ -n "$glyph" ] && [ "$glyph" -gt 0 ] 2>/dev/null; then
              rounds="$glyph"; rounds_src=glyph
            else
              rounds=unavailable; rounds_src=none
            fi
          fi
          rc=$(cat /tmp/measure.rc 2>/dev/null || echo "no-attempt")
          elapsed=$(cat /tmp/measure.elapsed 2>/dev/null || echo "0")
          echo "MEASURE label=${MEASURE_LABEL} to=${MEASURE_TO} from=${MEASURE_FROM} max_tools=${MEASURE_MAX_TOOLS} no_filter=${MEASURE_NO_FILTER} exclude='${MEASURE_EXCLUDE}' rc=${rc} elapsed_s=${elapsed} rounds=${rounds} rounds_src=${rounds_src} tokens=${tokens} findings=${findings}"
