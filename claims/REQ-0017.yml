schema: req.claim/2
claim_id: REQ-0017
statement: >-
  The req tool shall derive each claim's address at load as the versioned-tag
  digest of its canonical form bytes, so that recomputing the digest over those
  bytes reproduces the address the signed Baseline attests.
applicability: []
tests:
  - "req::address_recompute::the_address_recomputes_from_the_canonical_bytes_and_matches_the_signed_manifest"
evidence: machine
rationale:
  source: docs/adr/0022-claims-are-authored-fingerprints-are-derived.md
  date: 2026-11-04
  rejected_alternatives:
    - storing the canonical form and the address in the claim file (req.claim/1), which
      needed --fill and --verify and a rewrite of every claim on a rules bump
  assumptions:
    - the derivation is a pure function of the statement, the applicability, the subject
      registry and rules_v
    - history is never rewritten when rules change; an older manifest is UNVERIFIABLE until
      re-signed, never silently rehashed
relations:
  - type: refines
    to: REQ-0007
