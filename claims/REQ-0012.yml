schema: req.claim/2
claim_id: REQ-0012
statement: >-
  The req tool shall need no network access for any claim operation when the
  deployment is configured offline.
applicability:
  - deployment_mode == air_gapped
tests:
  - "req::evidence::the_core_crate_carries_no_network_client"
evidence: machine
rationale:
  source: docs/design.md
  date: 2026-10-07
  rejected_alternatives:
    - any provider that must be reachable to run a claim operation
  assumptions:
    - local models must suffice in air gapped deployments, cloud providers stay optional plugins
relations:
  - type: derives-from
    to: REQ-0007
