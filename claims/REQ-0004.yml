schema: req.claim/3
claim_id: REQ-0004
area: decisions
statement: >-
  The req tool shall emit proposals for reviewer ratification.
applicability: []
tests:
  - "req::evidence::a_provider_answer_is_an_unratified_proposal_never_an_edit"
evidence: machine
rationale:
  source: docs/adr/0004-model-proposes-human-disposes.md
  date: 2026-10-07
  rejected_alternatives:
    - LLM driven merge with deterministic fallback
    - no semantic layer at all (textual merge on prose)
  assumptions:
    - >-
      Scope (ADR 0021, 2026-11-03): the claim is satisfied by the core's single-pair seam, `req
      propose <a.yml> <b.yml>`, which turns an external provider's answer into an unratified
      proposal and never into an edit. The corpus-wide funnel is research in experiments/tier2/
      and is not the evidence for this claim.
relations:
  - type: refines
    to: REQ-0001
