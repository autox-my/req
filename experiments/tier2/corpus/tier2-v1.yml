    label: "equivalent"
    transform: "hand-authored paraphrase"
  - id: "T2-E-009"
    a: "Every proposal records the provider that produced it."
    b: "The provider behind each proposal is stored with the proposal."
    label: "equivalent"
    transform: "hand-authored paraphrase"
  - id: "T2-E-010"
    a: "The gate shall fail when an applying claim has no provenance."
