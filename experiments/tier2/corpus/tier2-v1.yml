# Tier-2 evaluation set v1 (design step 5).
#
# Three labels; every pair records the transformation that produced it, so the label is by
# construction and this corpus is reviewed through experiments/tier2/tools/build_tier2.py and its
# transformation table, not line by line. Equivalence transforms are exactly the ones the
# Tier-1 rules sanction (they leave the address unchanged). Unrelated pairs are HARD NEGATIVES:
# same shape, different meaning, enough shared terms for blocking to propose them, so they
# measure a provider's precision. Labels are authored, never derived from an implementation.
pairs:
  - id: "T2-E-001"
    a: "Each claim must record the identity of the engineer who authored it."
    b: "Every claim stores the identity of its author."
    label: "equivalent"
    transform: "hand-authored paraphrase"
  - id: "T2-E-002"
    a: "The engine shall verify a stored address against a fresh parse before any claim is served."
    b: "Before a claim is served, its stored address is re-checked against a new parse."
    label: "equivalent"
    transform: "hand-authored paraphrase"
  - id: "T2-E-003"
    a: "Merging two claims requires an explicit human approval."
    b: "No two claims are merged without a person approving the merge."
    label: "equivalent"
    transform: "hand-authored paraphrase"
  - id: "T2-E-004"
    a: "The tool shall perform every operation without a network connection."
    b: "No operation of the tool requires network access."
    label: "equivalent"
    transform: "hand-authored paraphrase"
  - id: "T2-E-005"
    a: "A proposal never changes the address of a claim."
    b: "The address of a claim is never changed by a proposal."
    label: "equivalent"
    transform: "hand-authored paraphrase"
  - id: "T2-E-006"
    a: "The audit shall list every claim the selection excludes."
    b: "Claims excluded by the selection are named in the audit."
    label: "equivalent"
    transform: "hand-authored paraphrase"
  - id: "T2-E-007"
    a: "Ratifying a baseline requires a signature from the key holder."
