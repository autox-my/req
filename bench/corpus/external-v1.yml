schema: req.bench.corpus/0
version: 1
rules: "External corpus v1: real requirement prose from other projects' repositories, pinned by commit — strictdoc@abf7be7daa2a25721a56980b5be15845336ea0b8, doorstop@f267ef67cb80b0eb0dcdf0597fe61f623e851e15. Pairs are labelled by construction (the transformation applied), not by the canonicalizer, so the labels are an independent oracle. Scope is Tier-1 only: equivalence uses meaning-preserving Tier-1 normalizations; paraphrase/voice/word-order are Tier-2 and out of scope. Modality transforms replace the FIRST occurrence, so multi-clause statements also exercise whether the tail beyond the first obligation is decomposed — see the findings recorded in docs/canonical-hashing.md 6.3."
