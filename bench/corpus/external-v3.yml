schema: req.bench.corpus/0
version: 3
rules: "External corpus v3: real requirement prose from other projects' repositories, pinned by commit — strictdoc@abf7be7daa2a25721a56980b5be15845336ea0b8, doorstop@f267ef67cb80b0eb0dcdf0597fe61f623e851e15, promise-nfr@b63dde159b41d6cb7be01f03fad2c2a59490de8b (deterministic sample: every 5th of 969 requirements, 47 project ids upstream). Pairs are labelled by construction (the transformation applied), not by the canonicalizer, so the labels are an independent oracle. Scope is Tier-1 only: equivalence uses meaning-preserving Tier-1 normalizations (emphasis, modality synonym, case/punctuation, digit grouping, exact power-of-ten unit scaling); paraphrase, voice and word-order are Tier-2 and out of scope. Modality transforms replace the FIRST occurrence, so multi-clause statements also exercise whether the tail beyond the first obligation is decomposed — see the findings in docs/canonical-hashing.md 6.3. Sphinx-Needs' bundled examples were evaluated and EXCLUDED: its own docs use standard Sphinx directives, and its demo project's 29 swreq needs carry a title plus attributes but no statement body, so they are not requirement statements."
