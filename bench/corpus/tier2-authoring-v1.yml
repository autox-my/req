# Tier-2 sample, positive tier — an AUTHORING sheet, not a labelling sheet.
#
# Two routes were measured and both are dead. Mining finds no positives: a mutation corpus pairs what
# its generator transformed, and cross-requirement pairs are different requirements that share
# vocabulary. History does not contain them either: requirement prose is rarely edited, because editing
# one is a controlled act with traceability attached — the strictdoc file has two commits and no
# statement changes, and doorstop's requirements were added rather than reworded. So the positives have
# to be written, and that is this sheet.
#
# For each statement, write three things:
#   equivalent:  a faithful restatement — same actor, object, bound, modality and conditions, different
#                wording. Do not swap one word and keep the sentence: write it as a colleague would
#                have, having read it once.
#   related:     a version that changes EXACTLY ONE structural element (actor, object, bound, modality,
#                or a condition). One, so each pair measures a single difference.
#   alteration:  name the element you changed and how, in a few words.
#
# Keep upstream artefacts — mangled quotes, odd spacing — as they are: they are real input. Work row by
# row without reading ahead; a sheet written in one voice and one sitting is a sample of that voice.
#
# When this is filled the pairs are derived: statement versus equivalent (equivalent by construction of
# the writing), statement versus related (not equivalent by construction). A second labeller then reads
# the derived pairs blind and labels them independently. That is the ceiling, and a disagreement between
# an author and a blind reader is the most informative number the sample can produce.
schema: req.tier2.authoring/0
rows:
- id: AUTH-001
  source: doorstop REQ001
  statement: Doorstop **shall** support the storage of external requirements assets.
  equivalent: Doorstop shall be capable of storing assets that originate from outside its own requirement set.
  related: Doorstop shall support the storage of external requirements assets and their associated metadata.
  alteration: object/scope — added associated metadata to the stored object
  writer: bob
  date: '2026-10-09'
- id: AUTH-002
  source: doorstop REQ008
  statement: Doorstop **shall** provide a way to view document items interactively.
  equivalent: Doorstop shall offer an interactive means of viewing the items in a document.
