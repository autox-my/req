# Tier-2 positive tier v1 — authored pairs, scored against human labels.
#
# The pool this corpus exists to supply: real paraphrases and deliberate one-element alterations.
# Mining could not produce them (a mutation corpus pairs what its generator transformed;
# cross-requirement pairs are different requirements sharing vocabulary) and history does not
# contain them (requirement prose is rarely edited). Fifteen statements were authored into a
# restatement and an alteration each, and one alteration was withheld — the key's `excluded` records
# that it changed a NOTE rather than an obligation.
#
# LABEL GRADE: the labels are two human readings, informed rather than blind — the answer key was
# visible in the copy they filled, and both matched it on all 29 pairs. That is what a copied key
# produces and also what two careful readers produce, so the labels cannot settle the construction's
# validity. They are enough to score a provider provisionally, and any number from them carries this.
#
# `transform` records the route, which for this corpus is the construction itself: the author's
# restatement, or the one structural element they changed, in their own words.
