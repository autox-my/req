schema: req.bench.corpus/0
version: 1
rules: "Direction gold set: every pair is a real requirement from another project (pinned by commit — strictdoc@abf7be7daa2a25721a56980b5be15845336ea0b8, doorstop@f267ef67cb80b0eb0dcdf0597fe61f623e851e15, promise-nfr@b63dde159b41d6cb7be01f03fad2c2a59490de8b, sampled every 5th of 969) with one mutation applied, and the `direction` label IS that mutation. Labels are therefore an independent oracle for `req compare`, never the classifier's output. Vocabulary: identical | modality_weakening | modality_strengthening | polarity_flip | numeric_loosening | numeric_tightening | scope_narrowing | scope_widening | scope_divergence | unrelated. A misspelled label FAILS the gate rather than disabling the check."
