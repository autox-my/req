# Release: build, prove and publish the Linux tarball of one rev of req (ADR 0025, amended by ADR 0029).
#
# Dispatch-only, on purpose. A release is cut when the owner asks (ADR 0025 §5), never because a
# commit landed, a pull request opened or a clock struck; so the only trigger is `workflow_dispatch`
# and tests/release_workflow.rs fails on any other. Dispatch it from `main` (Actions, Release, Run
# workflow): the workflow file and scripts/build-release.sh are taken from the dispatched ref, and
# the rev to release is the input.
#
# Two jobs, so the credential is held by as little code as possible:
#
#   build    `contents: read`. Resolves the input to a full SHA, refuses a rev that is not an ancestor
#            of origin/main, gives the runner the prerequisites ci.yml verifies (a C linker, minisign,
#            rustup with the toolchain the rev pins), and runs scripts/build-release.sh. The script, not
#            this file, builds from a clean copy of the rev with `--locked`, proves `built from` is the
#            bare rev, `baseline --verify` is [VERIFIED] and the FMR gate passes, and only then writes
#            the three assets. Nothing is built or packed here. It runs the rev's code, so it holds no
#            write permission and no secret.
#   publish  `contents: write`, and ONLY this job. It checks out nothing and runs none of the rev's
#            code: it takes the three assets as an artifact, re-checks them, creates the release
#            `rev-<REV>` if it is absent and uploads the assets with the `gh` CLI, authenticated by
#            this workflow's own GITHUB_TOKEN. **An asset name that already exists on the release is
#            an error, never a replacement** (no `--clobber`, no delete, no edit): a checksum that has
#            been pinned in an adopter's repository must stay true. It looks before it writes and
#            counts afterwards. The tarball goes last, so a visible tarball means the other two are
#            there; if a run dies before it, nothing is pinnable yet, and docs/releasing.md says what
#            to clear.
#
# No repository secret is configured or read: GITHUB_TOKEN is the one credential, minted per run.
# No `continue-on-error` and no `|| true` anywhere: a failed step fails the release.
#
# The macOS tarball is not built here: it is the same script on the owner's machine (docs/releasing.md).
# The runner is Linux, so the glibc floor of the Linux tarball is this runner's; the script records it
# in the `.build-info` asset.

name: Release

on:
  workflow_dispatch:
    inputs:
      rev:
        description: "The commit to release: a SHA, a short SHA or a ref that resolves to a commit on main"
        required: true
        type: string

# Read-only by default; the publishing job alone raises it.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      full: ${{ steps.resolve.outputs.full }}
    steps:
      - name: checkout, with the history the rev is resolved in
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: the tooling is main's, and the rev to release is resolved and on main
        id: resolve
        env:
          REV_INPUT: ${{ github.event.inputs.rev }}
        run: |
          set -euo pipefail
          # This job runs the checked-out scripts/build-release.sh and the checked-out workflow, so
          # the ref it was dispatched from decides which code proves the binary. Only main's does;
          # a dispatch from any other branch would run that branch's proofs (or none).
          if [ "${GITHUB_REF:-}" != refs/heads/main ]; then
            echo "::error::dispatched from '${GITHUB_REF:-}'; dispatch Release from main only (the proofs are main's script, ADR 0025 §2)"
            exit 1
          fi
          if [ -z "${REV_INPUT:-}" ]; then
            echo "::error::the rev input is empty"
            exit 1
          fi
          # The input is a name, never a command: anything outside a ref's alphabet is refused
          # before it reaches git.
          case $REV_INPUT in
            *[!0-9A-Za-z._/-]* | -*)
              echo "::error::the rev input is not a SHA or a ref name"
              exit 1
              ;;
          esac
          full="$(git rev-parse --verify --quiet "${REV_INPUT}^{commit}")" || {
            echo "::error::cannot resolve '$REV_INPUT' to a commit in this checkout"
            exit 1
          }
          if ! git cat-file -e origin/main 2>/dev/null; then
            echo "::error::origin/main is not in this checkout, so 'the rev is on main' cannot be checked — fail closed"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$full" origin/main; then
            echo "::error::$full is not an ancestor of origin/main; only a rev on main is released"
            exit 1
          fi
          # The toolchain the rev pins, so the next step installs the one the build will ask for.
          channel="$(git show "$full:rust-toolchain.toml" | sed -n 's/^channel *= *"\([^"]*\)".*/\1/p')"
          case $channel in
            '' | *[!0-9A-Za-z._-]*)
              echo "::error::$full has no usable channel in rust-toolchain.toml"
              exit 1
              ;;
          esac
          echo "releasing $full (toolchain $channel)"
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "REL_FULL=$full" >> "$GITHUB_ENV"
          echo "REL_CHANNEL=$channel" >> "$GITHUB_ENV"

      - name: the C toolchain the build scripts link against
        run: |
          set -eu
          # A rustup toolchain is not sufficient: crates with build scripts (proc-macro2, quote,
          # serde_core, generic-array) need a linker. Same check, same reason, as ci.yml.
          if ! command -v cc >/dev/null 2>&1; then
            echo "::error::no C linker on this runner, so every Rust build script will fail to link"
            echo "On a Debian-ish host: sudo apt-get update && sudo apt-get install -y build-essential"
            exit 1
          fi
          cc --version | head -1

      - name: minisign, the verifier the Baseline proof needs
        run: |
          set -eu
          # scripts/build-release.sh answers exit 3 (UNVERIFIABLE) without it, and the Baseline proof
          # has no SKIP. The GitHub-hosted image does not ship minisign, so install it from the
          # distribution when it is absent, then verify the effect: a runner that still lacks it fails
          # naming the reason. Same step, same reason, as ci.yml.
          if ! command -v minisign >/dev/null 2>&1; then
            sudo apt-get update -o Acquire::Retries=3
            sudo apt-get install -y -o Acquire::Retries=3 minisign
          fi
          if ! command -v minisign >/dev/null 2>&1; then
            echo "::error::minisign is not installed, so the Baseline proof cannot verify"
            echo "On a Debian-ish host: sudo apt-get update && sudo apt-get install -y minisign"
            exit 1
          fi
          minisign -v

      - name: rustup and the toolchain the rev pins
        run: |
          set -eu
          export RUSTUP_HOME="$HOME/.rustup"
          if ! command -v rustup >/dev/null 2>&1; then
            # To a file, then run: a retry of a piped download could feed a half-read script to sh.
            installer="$(mktemp)"
            curl --proto '=https' --tlsv1.2 --retry 3 --retry-all-errors -sSf https://sh.rustup.rs -o "$installer"
            sh "$installer" -y --profile minimal --default-toolchain none
            . "$HOME/.cargo/env"
          fi
          # Minimal: the build needs neither rustfmt nor clippy (they are the gate's, not the release's).
          rustup toolchain install "$REL_CHANNEL" --profile minimal
          rustup run "$REL_CHANNEL" cargo --version
          # Publish the toolchain to LATER steps: a runner does not carry one step's `export` forward.
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "RUSTUP_HOME=$HOME/.rustup" >> "$GITHUB_ENV"

      - name: build, prove and bundle with scripts/build-release.sh
        run: |
          set -eu
          if [ -z "${REL_FULL:-}" ]; then
            echo "::error::REL_FULL is not set — the runner did not carry $GITHUB_ENV to this step"
            exit 1
          fi
          out="$RUNNER_TEMP/release-out"
          # A directory of this job's own, so the script's "refuse an existing name" rule is not
          # tripped by a previous job on a persistent runner.
          rm -rf "$out"
          # Exit 0 released; 1 a check failed; 2 usage or environment; 3 UNVERIFIABLE (no minisign).
          # Any non-zero fails this step, and the script has then written nothing.
          bash scripts/build-release.sh --rev "$REL_FULL" --out "$out"

      - name: hand the three assets to the publishing job
        uses: actions/upload-artifact@v4
        with:
          name: release-out
          path: ${{ runner.temp }}/release-out
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The only write permission in this workflow, and the only job that holds the token.
    permissions:
      contents: write
    steps:
      - name: receive the assets
        uses: actions/download-artifact@v4
        with:
          name: release-out
          path: ${{ runner.temp }}/release-out

      - name: publish the release rev-REV, refusing to replace any asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          REL_FULL: ${{ needs.build.outputs.full }}
          RELEASE_OUT: ${{ runner.temp }}/release-out
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_OUT:-}" ] || [ ! -d "$RELEASE_OUT" ]; then
            echo "::error::RELEASE_OUT is not set or is not a directory — the build job did not hand over its assets"
            exit 1
          fi
          case ${REL_FULL:-} in
            '' | *[!0-9a-f]*)
              echo "::error::the build job did not report a usable full SHA"
              exit 1
              ;;
          esac

          target=x86_64-unknown-linux-gnu
          set -- "$RELEASE_OUT"/req-*-"$target".tar.gz
          if [ $# -ne 1 ] || [ ! -f "$1" ]; then
            echo "::error::expected exactly one req-<REV>-$target.tar.gz in $RELEASE_OUT"
            exit 1
          fi
          tarball="$(basename "$1")"
          rev="${tarball#req-}"
          rev="${rev%-"$target".tar.gz}"
          case $rev in
            '' | *[!0-9a-f]*)
              echo "::error::'$rev' is not a bare SHA; a release is named after the rev the binary reports"
              exit 1
              ;;
          esac
          if [ "${#rev}" -lt 7 ] || [ "${#rev}" -gt 40 ]; then
            echo "::error::'$rev' is not 7 to 40 hex digits"
            exit 1
          fi
          tag="rev-$rev"
          # The tarball goes last: a visible tarball means the other two assets are already there.
          names="req-$rev-$target.build-info req-$rev-$target.tar.gz.sha256 $tarball"
          for name in $names; do
            if [ ! -f "$RELEASE_OUT/$name" ]; then
              echo "::error::the build job did not write $name"
              exit 1
            fi
          done
          full="$(sed -n 's/^sha=//p' "$RELEASE_OUT/req-$rev-$target.build-info")"
          case $full in
            '' | *[!0-9a-f]*)
              echo "::error::the build-info has no usable full SHA"
              exit 1
              ;;
          esac

          # What is published is what was checked, and this is decided BEFORE the first write (a wrong
          # release cannot be repaired afterwards: no asset is ever replaced or deleted): the rev the
          # script built is the rev the build job resolved and required to be on main, and the tag's
          # short rev is that commit's prefix, whatever the script's output says.
          if [ "$full" != "$REL_FULL" ]; then
            echo "::error::the build-info names $full, not the resolved $REL_FULL; refusing to publish"
            exit 1
          fi
          case $full in
            "$rev"*) ;;
            *)
              echo "::error::the tag rev '$rev' is not a prefix of $full; refusing to publish"
              exit 1
              ;;
          esac
          # The bytes crossed an artifact store between the two jobs: the sidecar the script wrote must
          # still describe the tarball it sits beside.
          sum="$(cut -d' ' -f1 "$RELEASE_OUT/req-$rev-$target.tar.gz.sha256")"
          actual="$(sha256sum "$RELEASE_OUT/$tarball" | cut -d' ' -f1)"
          if [ "$sum" != "$actual" ]; then
            echo "::error::$tarball hashes to $actual, not the $sum its sidecar names; refusing to publish"
            exit 1
          fi

          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT

          # The release for this rev: look it up, create it only when `gh` says it is absent. Any other
          # failure to look is a failure, not a reason to create. A draft is refused: an asset uploaded
          # into a draft is invisible to adopters, which would break "a visible tarball means the other
          # two are there", and this workflow never edits a release.
          if gh release view "$tag" --json isDraft --jq .isDraft > "$work/draft" 2> "$work/view.err"; then
            if [ "$(cat "$work/draft")" != false ]; then
              echo "::error::release $tag exists as a draft; publish or delete it by hand first (this workflow never edits a release)"
              exit 1
            fi
            echo "release $tag exists"
          elif grep -qi 'release not found' "$work/view.err"; then
            gh release create "$tag" --target "$full" --title "$tag" \
              --notes "Prebuilt req for the pinned rev $rev (ADR 0025). Pin the .sha256 of the tarball in your own repository."
            echo "created release $tag"
          else
            echo "::error::looking up the release $tag failed:"
            head -c 300 "$work/view.err" | LC_ALL=C tr -c '[:print:]\n' '?'
            echo
            exit 1
          fi

          list_assets() {
            gh release view "$tag" --json assets --jq '.assets[].name'
          }

          # How many times a name is in the listing. `grep -c` reads the whole listing (no early exit, so
          # no SIGPIPE under pipefail) and exits 1 on zero matches, which is an answer here, not a fault.
          times_listed() {
            n="$(printf '%s\n' "$existing" | grep -Fxc -- "$1")" || n=0
            echo "$n"
          }

          # Look before writing. An asset name that is already on the release is an error, for all
          # three names, before the first byte is uploaded.
          existing="$(list_assets)"
          for name in $names; do
            if [ "$(times_listed "$name")" != 0 ]; then
              echo "::error::$name already exists on release $tag — refusing to replace it (a checksum that has been pinned must stay true; ADR 0025 §5)"
              exit 1
            fi
          done

          for name in $names; do
            gh release upload "$tag" "$RELEASE_OUT/$name"
            echo "uploaded $name"
          done

          # And count afterwards: each name exactly once. A concurrent run that raced this one shows up here.
          existing="$(list_assets)"
          for name in $names; do
            n="$(times_listed "$name")"
            if [ "$n" != 1 ]; then
              echo "::error::$name is on release $tag $n times after the upload; expected exactly once"
              exit 1
            fi
          done

          echo "released $tag"
          echo "pin (Linux): REV=$rev SHA256=$sum TARGET=$target"
