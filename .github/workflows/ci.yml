# req's CI: the same gate as scripts/check.sh, invoked rather than reimplemented.
#
# One implementation, two invocations. There is no check logic in this file: a check added to
# scripts/check.sh runs here with no change, and the two cannot drift.
#
# Four things shape it, all of them load-bearing.
#
#   0. It runs with read-only permissions and no secret (`permissions: contents: read`, and the
#      triggers below never include `pull_request_target`), so a pull request from a fork cannot
#      reach a credential through it. A change that needed a secret here would be a different
#      workflow, not an edit of this one.
#
#   1. scripts/check.sh resolves the toolchain from $HOME/.rustup/toolchains/<channel>-*/bin and
#      exits 2 when it finds none. A container image that ships cargo without rustup, or that
#      puts RUSTUP_HOME elsewhere (the official rust images use /usr/local/rustup), fails the
#      gate outright. rustup must own $HOME/.rustup for the runner's user; the GitHub-hosted
#      runner image does, and the step below installs the pinned channel into it.
#
#   2. It prints SKIP and still exits 0 when a check could not run: rustfmt, clippy, python3 and
#      the review CLI can each skip. A green exit is therefore not a verdict, which is why the
#      last step fails the job when any SKIP line appears. "A skipped check is never a pass" is
#      enforced here rather than trusted. The Baseline step is the exception: it has no SKIP,
#      because an unverified Baseline is UNVERIFIABLE, so this workflow verifies minisign above
#      and the gate blocks without it.
#
#   3. runs-on must name a label some runner actually carries: `ubuntu-latest` is a GitHub-hosted
#      runner. A fork that moves to a self-hosted runner changes this one line to the label it
#      registered with; a label no runner carries queues forever, which reads as "CI is slow"
#      rather than "CI is absent".
#
# Every download of a tool retries a transient server error (`--retry 3 --retry-all-errors`): the
# first run of this workflow on its previous host failed once on a 504 from the nextest download. A
# retry is never a way around a check: the SHA-256 of the nextest tarball is compared AFTER the
# download and a mismatch fails the step, with no retry.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Manual dispatch, so a green run can be produced on demand without inventing a commit.
  workflow_dispatch:

# Read-only for the whole workflow; the one job below asks for nothing more.
permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          # Full history, so origin/main resolves here. On a pull_request event the default
          # depth-1 fetch brings only the merge ref, and the trust-anchor step below would
          # then read "absent" and fail closed on every change.
          fetch-depth: 0

      - name: the C toolchain the build scripts link against
        run: |
          set -eu
          # A rustup toolchain is not sufficient: crates with build scripts (proc-macro2, quote,
          # serde_core, generic-array) need a linker. The first run of this workflow failed here and
          # reported it as an unrelated-looking compile cascade, so the check is explicit and first.
          if ! command -v cc >/dev/null 2>&1; then
            echo "::error::no C linker on this runner, so every Rust build script will fail to link"
            echo "On a Debian-ish host: sudo apt-get update && sudo apt-get install -y build-essential"
            echo "The GitHub-hosted ubuntu-latest image ships gcc; a self-hosted runner needs it installed."
            exit 1
          fi
          cc --version | head -1

      - name: minisign, the verifier the Baseline step needs
        run: |
          set -eu
          # scripts/check.sh re-verifies the committed Baseline on every run, and that step has
          # no SKIP: with no verifier req answers UNVERIFIABLE and the gate blocks. The GitHub-hosted
          # image does not ship minisign, so install it from the distribution when it is absent, then
          # verify the effect here: a runner that still lacks it fails naming the reason, rather than
          # as an UNVERIFIABLE verdict inside the gate log.
          if ! command -v minisign >/dev/null 2>&1; then
            sudo apt-get update -o Acquire::Retries=3
            sudo apt-get install -y -o Acquire::Retries=3 minisign
          fi
          if ! command -v minisign >/dev/null 2>&1; then
            echo "::error::minisign is not installed, so the Baseline step cannot verify"
            echo "On a Debian-ish host: sudo apt-get update && sudo apt-get install -y minisign"
            echo "On macOS: brew install minisign"
            exit 1
          fi
          minisign -v

      - name: rustup, the pinned channel, and the components the gate needs
        run: |
          set -eu
          export RUSTUP_HOME="$HOME/.rustup"
          if ! command -v rustup >/dev/null 2>&1; then
            # To a file, then run: a retry of a piped download could feed a half-read script to sh.
            installer="$(mktemp)"
            curl --proto '=https' --tlsv1.2 --retry 3 --retry-all-errors -sSf https://sh.rustup.rs -o "$installer"
            sh "$installer" -y --profile minimal --default-toolchain none
            . "$HOME/.cargo/env"
          fi
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
          rustup run 1.99.0 cargo --version
          rustup run 1.99.0 rustfmt --version
          rustup run 1.99.0 cargo clippy --version
          # Publish the toolchain to LATER steps: a runner does not carry one step's `export`
          # forward, so without these two lines the next `cargo` is a 127. `$HOME/.cargo/bin` is
          # where rustup put the shims (and where `cargo install` will put the test runner), and
          # RUSTUP_HOME is the tree those shims resolve.
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "RUSTUP_HOME=$HOME/.rustup" >> "$GITHUB_ENV"

      - name: the trust anchor, taken from origin/main rather than from this pull request
        run: |
          set -eu
          # The trust anchor is a root of trust, so in CI it must come from origin/main and never
          # from the pull request. The exploit this closes: a pull request swaps the key in
          # baselines/trust.yml, re-signs its manifest under that key, and its own gate reports
          # [VERIFIED].
          #
          # Written IN PLACE, not as a copy elsewhere, because req reads
          # the anchor through the ADR-0012 corpus root: root.join(TRUST_PATH), with TRUST_PATH
          # = "baselines/trust.yml" (src/baseline.rs:992 reading src/baseline.rs:27). The gate
          # runs from the checkout root and walk-up selects it, so the resolved root IS this
          # tree, and the file at that read location is this file. A copy kept anywhere else
          # would be read by nothing.
          #
          # The echos here are descriptive, never file content: nothing in this step may put
          # bytes on stdout that a later step could mistake for its own output.
          #
          # Rotation under this anchor is now two pull requests: add the new key beside the old
          # one (the manifest is still signed with the old key, which remains in origin/main's
          # anchor, so the gate stays green), then re-sign under the new key; revoke or expire
          # the old key only after both have merged. See the Baselines bullet in AGENTS.md.
          ANCHOR_PATH=baselines/trust.yml
          if git cat-file -e "origin/main:$ANCHOR_PATH" 2>/dev/null; then
            git show "origin/main:$ANCHOR_PATH" > "$ANCHOR_PATH"
            echo "judging with the trust anchor from origin/main"
          else
            # Fail CLOSED: falling back to this checkout would let the change under review supply
            # the anchor that judges it.
            echo "::error::origin/main has no $ANCHOR_PATH — fail closed, never fall back to this checkout (a pull request could then supply the trust anchor that judges it)"
            exit 1
          fi

      - name: the pinned test runner — a prebuilt binary, never a compile
        run: |
          set -eu
          # ADR 0019: nextest is adopted for its JUnit artefact, not for speed. `cargo install`
          # **compiles** ~300 crates (8+ minutes in CI, measured); the release ships a prebuilt
          # binary, so this step downloads one instead. Pin BOTH the version and the tarball's
          # sha256: the hash is provenance, and a swapped artefact must fail HERE rather than
          # become the test runner. (The 0.9.149 notes advise the prebuilt download over
          # `cargo nextest self update`, which is why no self-update appears anywhere.)
          #
          # `scripts/check.sh` still verifies the version at run time — a different installed
          # version is a FAIL naming both, never a silent substitution.
          VERSION=0.9.149
          TARGET=x86_64-unknown-linux-gnu
          SHA256=32d1d8c0567b7a80bee2bad8bb09125c846da96bc009b2de11ec08557290c770
          url="https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-${VERSION}/cargo-nextest-${VERSION}-${TARGET}.tar.gz"
          tmp="$(mktemp -d)"
          curl --proto '=https' --tlsv1.2 --retry 3 --retry-all-errors -fsSL "$url" -o "$tmp/nextest.tar.gz"
          echo "${SHA256}  $tmp/nextest.tar.gz" | sha256sum -c -
          tar -xzf "$tmp/nextest.tar.gz" -C "$tmp"
          # One root-level member (`cargo-nextest`, 0755); absent = a layout change, named here.
          test -x "$tmp/cargo-nextest"
          mkdir -p "$GITHUB_WORKSPACE/.cargo-home/bin"
          install -m 0755 "$tmp/cargo-nextest" "$GITHUB_WORKSPACE/.cargo-home/bin/cargo-nextest"
          "$GITHUB_WORKSPACE/.cargo-home/bin/cargo-nextest" --version

      - name: the gate — the exit code and the log both count
        run: |
          set -o pipefail
          bash scripts/check.sh 2>&1 | tee /tmp/gate.log
          rc=${PIPESTATUS[0]}
          echo "check.sh exit: $rc"
          if grep -q '^SKIP' /tmp/gate.log; then
            echo "::error::a check was skipped; a skipped check is never a pass"
            grep '^SKIP' /tmp/gate.log
            exit 1
          fi
          exit $rc
